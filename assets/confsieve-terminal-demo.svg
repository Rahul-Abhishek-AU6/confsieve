<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="ConfSieve terminal output catching ghost and zombie configuration drift">
  <rect width="1200" height="780" fill="#0d1117" rx="16"/>
  <!-- Window Controls -->
  <circle cx="36" cy="34" r="8" fill="#ff5f57"/>
  <circle cx="62" cy="34" r="8" fill="#febc2e"/>
  <circle cx="88" cy="34" r="8" fill="#28c840"/>
