    <!-- Scanned Metadata -->
    <text x="40" y="215" fill="#f0f6fc" font-weight="bold">Scanned Files:</text>
    <text x="40" y="240" fill="#8b949e">  Code Files   (1): billing_service.py</text>
    <text x="40" y="265" fill="#8b949e">  Config Files (1): config.yaml</text>

    <!-- Ghost Section -->
    <text x="40" y="315" fill="#ff7b72" font-weight="bold">👻 GHOST CONFIGURATIONS (2 detected)</text>
    <text x="40" y="340" fill="#8b949e" font-size="15">   Code accesses these keys, but they do NOT exist in the configuration manifest:</text>

    <text x="40" y="380" fill="#ff7b72" font-weight="bold">  ✖ payment_gateway_timeout</text>
    <text x="340" y="380" fill="#8b949e" font-size="15">(default: 30)</text>
    <text x="75" y="405" fill="#8b949e" font-size="15">at billing_service.py:11 [config via get]</text>

    <text x="40" y="445" fill="#ff7b72" font-weight="bold">  ✖ stripe_webhook_secret</text>
    <text x="75" y="470" fill="#8b949e" font-size="15">at billing_service.py:12 [config via subscript]</text>

    <!-- Zombie Section -->
    <text x="40" y="525" fill="#d29922" font-weight="bold">🧟 ZOMBIE CONFIGURATIONS (2 detected)</text>
    <text x="40" y="550" fill="#8b949e" font-size="15">   Declared in configuration manifest, but NEVER accessed anywhere in code:</text>

    <text x="40" y="590" fill="#d29922" font-weight="bold">  ⚠ legacy_auth_token</text>
    <text x="75" y="615" fill="#8b949e" font-size="15">at config.yaml:10 [yaml]</text>

    <text x="40" y="655" fill="#d29922" font-weight="bold">  ⚠ legacy_sso_endpoint</text>
    <text x="75" y="680" fill="#8b949e" font-size="15">at config.yaml:11 [yaml]</text>

    <!-- Summary Box -->
    <text x="40" y="730" fill="#ff7b72" font-weight="bold">Status: FAIL: DRIFT DETECTED</text>
    <text x="340" y="730" fill="#8b949e">| Lookups: 5 | Manifest Keys: 7 | Matched: 5 | Ghosts: 2 | Zombies: 2</text>
